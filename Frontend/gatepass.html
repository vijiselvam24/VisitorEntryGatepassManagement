
<input type="number" id="visitId" placeholder="Visit ID" required>

<input type="datetime-local" id="issuedAt" required>

<select id="passStatus" required>
    <option value="">Select Status</option>
    <option value="Active">Active</option>
    <option value="Completed">Completed</option>
    <option value="Cancelled">Cancelled</option>
</select>

<button onclick="generatePass()">Generate Gate Pass</button>
<button onclick="location.href='dashboard.html'">Back</button>
<p id="passMessage"></p>
<button id="printButton" onclick="window.print()" style="display:none;">
    Print Gate Pass
</button>

<script src="script.js"></script>
