<!DOCTYPE html>
<html>
<head>
    <title>Host Details</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="form-box">
        <h2>Host & Department</h2>

        <input
            type="text"
            id="department"
            placeholder="Department Name"
            required
        >

        <input
            type="text"
            id="hostName"
            placeholder="Host Name"
            required
        >

        <input
            type="tel"
            id="hostContact"
            placeholder="Host Contact"
            required
        >

        <button onclick="saveHost()">Save</button>

        <button onclick="location.href='dashboard.html'">
            Back
        </button>

        <p id="message"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
